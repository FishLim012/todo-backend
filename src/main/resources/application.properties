spring.application.name=todo-backend

# 服务器端口设为 8080（避免和之前的 3000 端口冲突）
server.port=8080

# 配置 SQLite 本地数据库文件路径（会自动在项目根目录创建 local_data.db）
spring.datasource.url=jdbc:sqlite:local_data.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# 开启跨域允许（让未来的 TypeScript 前端能顺利访问）
spring.web.cors.allow-origin=*