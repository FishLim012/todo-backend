<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的全栈 To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
        .add-btn { background-color: #28a745; color: white; }
        .add-btn:hover { background-color: #218838; }
        ul { padding-left: 0; }
        li { list-style: none; display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .completed { text-decoration: line-through; color: #888; }
        .btn-group { display: flex; gap: 5px; }
        .complete-btn { background-color: #ffc107; color: #333; }
        .delete-btn { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📝 我的 To-Do List 任务清单</h2>
        
        <!-- 输入框和添加按钮 -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="输入一个任务，比如：复习 Spring Boot">
            <button class="add-btn" onclick="addTask()">添加任务</button>
        </div>

        <!-- 任务列表展示区 -->
        <ul id="taskList">
            <!-- 动态加载 -->
        </ul>
    </div>

    <script>
        // 1. 获取所有任务 (READ)
        async function loadTasks() {
            try {
                const response = await fetch('http://localhost:8080/api/tasks');
                const tasks = await response.json();
                
                const ul = document.getElementById('taskList');
                ul.innerHTML = ''; // 清空旧列表
                
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    const isCompleted = task.status === 'COMPLETED';
                    
                    // 任务名称文字
                    const span = document.createElement('span');
                    span.className = isCompleted ? 'completed' : '';
                    span.innerText = task.taskName;
                    li.appendChild(span);

                    // 按钮组容器
                    const btnGroup = document.createElement('div');
                    btnGroup.className = 'btn-group';

                    // 完成/撤销按钮 (UPDATE)
                    const toggleBtn = document.createElement('button');
                    toggleBtn.className = 'complete-btn';
                    toggleBtn.innerText = isCompleted ? '撤销' : '完成';
                    toggleBtn.onclick = () => toggleTaskStatus(task.id, task.status);
                    btnGroup.appendChild(toggleBtn);

                    // 删除按钮 (DELETE)
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.innerText = '删除';
                    deleteBtn.onclick = () => deleteTask(task.id);
                    btnGroup.appendChild(deleteBtn);

                    li.appendChild(btnGroup);
                    ul.appendChild(li);
                });
            } catch (e) {
                console.error("无法连接到 Java 后端", e);
            }
        }

        // 2. 添加任务 (CREATE)
        async function addTask() {
            const input = document.getElementById('taskInput');
            const taskName = input.value.trim();
            if (!taskName) return alert('请输入任务内容！');

            await fetch('http://localhost:8080/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskName: taskName })
            });

            input.value = ''; 
            loadTasks();     
        }

        // 3. 切换任务状态 (UPDATE)
        async function toggleTaskStatus(id, currentStatus) {
            const newStatus = currentStatus === 'COMPLETED' ? 'PENDING' : 'COMPLETED';
            
            // 1. 先更新本地 SQLite 的任务状态
            await fetch(`http://localhost:8080/api/tasks/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });

            // 2. 【新增】如果任务是从 未完成 -> 变成完成，则向云端 Firebase 发送加分请求！
            if (newStatus === 'COMPLETED') {
                try {
                    const cloudResponse = await fetch('http://localhost:8080/api/user/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: "TestUser" }) // 暂时先用 TestUser 作为用户名
                    });
                    const cloudResult = await cloudResponse.json();
                    console.log("🔥 云端加分响应:", cloudResult);
                } catch (err) {
                    console.error("云端加分失败", err);
                }
            }

            loadTasks();
        }

        // 4. 删除任务 (DELETE)
        async function deleteTask(id) {
            await fetch(`http://localhost:8080/api/tasks/${id}`, {
                method: 'DELETE'
            });

            loadTasks();
        }

        // 页面刚加载完就拉取任务
        loadTasks();
    </script>
</body>
</html>
